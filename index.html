<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TATA - Algorithmic Trading Charts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #fff;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
        }

        .header {
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            color: #00d4ff;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        .controls input,
        .controls select,
        .controls button {
            padding: 10px 15px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }

        .controls button {
            background: #00d4ff;
            color: #000;
            font-weight: bold;
            transition: background 0.3s;
        }

        .controls button:hover {
            background: #00a8cc;
        }

        #chart-container {
            flex: 1;
            background: #222;
            border-radius: 8px;
            border: 1px solid #444;
            overflow: hidden;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 4px;
            border-left: 4px solid #00d4ff;
        }

        .info p {
            margin: 5px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 TATA Trading Charts</h1>
            <p>Real-time Algorithmic Trading Data Visualization</p>
        </div>

        <div class="controls">
            <input type="text" id="symbol" placeholder="Enter symbol (e.g., AAPL)" value="AAPL">
            <select id="interval">
                <option value="1">1 Minute</option>
                <option value="5">5 Minutes</option>
                <option value="15">15 Minutes</option>
                <option value="60" selected>1 Hour</option>
                <option value="D">1 Day</option>
            </select>
            <button onclick="loadChart()">Load Chart</button>
            <button onclick="updateChart()">Refresh Data</button>
        </div>

        <div id="chart-container"></div>

        <div class="info">
            <p><strong>Status:</strong> <span id="status">Ready</span></p>
            <p><strong>Last Update:</strong> <span id="last-update">-</span></p>
            <p><strong>Data Points:</strong> <span id="data-points">0</span></p>
        </div>
    </div>

    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="app.js"></script>
</body>
</html>
